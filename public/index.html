<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Never Hide Chat Camp — Connect with Ghana Cyber</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0e14;
      --surface: #151b23;
      --surface-hover: #1d2530;
      --primary: #0ea5e9;
      --primary-glow: rgba(14, 165, 233, 0.3);
      --accent: #8b5cf6;
      --text: #e8eef5;
      --text-dim: #8b96a5;
      --bubble-me: #0ea5e9;
      --bubble-them: #1d2530;
      --bubble-system: #2a2f3a;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== LANDING PAGE ===== */
    #landing {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding: 20px;
      background: radial-gradient(ellipse at top, rgba(14, 165, 233, 0.08), transparent 50%),
                  radial-gradient(ellipse at bottom, rgba(139, 92, 246, 0.06), transparent 50%);
    }
    .landing-card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      animation: fadeUp 0.6s ease;
    }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .logo-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 0 40px var(--primary-glow);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { box-shadow: 0 0 40px var(--primary-glow); } 50% { box-shadow: 0 0 60px var(--primary-glow); } }
    .logo-circle span { font-size: 42px; }
    
    .landing-card h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .landing-card .subtitle {
      color: var(--text-dim);
      font-size: 15px;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 100px;
      font-size: 13px;
      color: var(--success);
      margin: 16px 0 32px;
      font-weight: 600;
    }
    .status-dot {
      width: 8px; height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 8px;
      margin-left: 4px;
    }
    .input-field {
      width: 100%;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: var(--transition);
      outline: none;
    }
    .input-field:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .input-field::placeholder { color: rgba(255, 255, 255, 0.25); }
    
    .join-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
    }
    .join-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px var(--primary-glow); }
    .join-btn:active { transform: translateY(0); }
    
    .landing-footer {
      margin-top: 28px;
      font-size: 12px;
      color: var(--text-dim);
    }
    .landing-footer a { color: var(--primary); text-decoration: none; }

    /* ===== CHAT PAGE ===== */
    #chat-page { display: none; flex-direction: column; height: 100vh; }
    #chat-page.active { display: flex; }
    
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
      z-index: 10;
    }
    .chat-header .avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .chat-header-info { flex-grow: 1; }
    .chat-header-info h2 { font-size: 16px; font-weight: 700; }
    .chat-header-info .status { font-size: 12px; color: var(--success); display: flex; align-items: center; gap: 4px; }
    .chat-header-info .status .dot { width: 6px; height: 6px; background: var(--success); border-radius: 50%; }
    
    .leave-btn {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-dim);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: var(--transition);
    }
    .leave-btn:hover { color: var(--danger); border-color: var(--danger); }
    
    #messages {
      flex-grow: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--bg);
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 3px; }
    
    .msg {
      max-width: 75%;
      padding: 10px 16px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.5;
      word-wrap: break-word;
      animation: msgIn 0.3s ease;
      position: relative;
    }
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    
    .msg.me {
      align-self: flex-end;
      background: var(--bubble-me);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.them {
      align-self: flex-start;
      background: var(--bubble-them);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom-left-radius: 4px;
    }
    .msg.system {
      align-self: center;
      background: var(--bubble-system);
      color: var(--text-dim);
      font-size: 13px;
      max-width: 90%;
      text-align: center;
      border-radius: 12px;
    }
    .msg .time {
      display: block;
      font-size: 10px;
      margin-top: 4px;
      opacity: 0.6;
      text-align: right;
    }
    .msg.them .time { text-align: left; }
    .msg.them .sender-name {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 2px;
    }
    
    .typing-indicator {
      display: none;
      align-self: flex-start;
      padding: 12px 16px;
      background: var(--bubble-them);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
    }
    .typing-indicator.active { display: flex; gap: 4px; }
    .typing-indicator span {
      width: 8px; height: 8px;
      background: var(--text-dim);
      border-radius: 50%;
      animation: typingBounce 1.4s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
    
    .input-bar {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      background: var(--surface);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      flex-shrink: 0;
    }
    .input-bar input {
      flex-grow: 1;
      padding: 14px 18px;
      background: var(--bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      color: var(--text);
      font-size: 14.5px;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
    }
    .input-bar input:focus { border-color: var(--primary); }
    .send-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .send-btn:hover { transform: scale(1.08); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .send-btn svg { width: 20px; height: 20px; fill: white; }
    
    /* Emoji bar */
    .emoji-bar {
      display: flex;
      gap: 4px;
      padding: 6px 16px;
      background: var(--surface);
      overflow-x: auto;
      flex-shrink: 0;
    }
    .emoji-bar::-webkit-scrollbar { display: none; }
    .emoji-bar span {
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: var(--transition);
      flex-shrink: 0;
    }
    .emoji-bar span:hover { background: var(--surface-hover); transform: scale(1.15); }
    
    /* Responsive */
    @media (max-width: 480px) {
      .msg { max-width: 85%; }
      .landing-card { padding: 10px; }
      #messages { padding: 12px; }
    }
  </style>
</head>
<body>
  <!-- ===== LANDING PAGE ===== -->
  <div id="landing">
    <div class="landing-card">
      <div class="logo-circle"><span>💬</span></div>
      <h1>Never Hide Chat Camp</h1>
      <p class="subtitle">Connect with Ghana Cyber — live and direct</p>
      <div class="status-badge">
        <span class="status-dot"></span>
        Ghana Cyber is online
      </div>
      
      <div class="input-group">
        <label>Your Name</label>
        <input type="text" id="name-input" class="input-field" placeholder="What should I call you?" maxlength="30" autocomplete="off" />
      </div>
      
      <button class="join-btn" id="join-btn" onclick="joinChat()">Start Chatting</button>
      
      <p class="landing-footer">
        Your messages go straight to Ghana Cyber's Telegram<br>
        🔒 Powered by Never Hide Chat Camp
      </p>
    </div>
  </div>

  <!-- ===== CHAT PAGE ===== -->
  <div id="chat-page">
    <div class="chat-header">
      <div class="avatar">💬</div>
      <div class="chat-header-info">
        <h2>Ghana Cyber</h2>
        <div class="status"><span class="dot"></span> Online via Telegram</div>
      </div>
      <button class="leave-btn" onclick="leaveChat()">Leave</button>
    </div>
    
    <div id="messages"></div>
    
    <div class="typing-indicator" id="typing-indicator">
      <span></span><span></span><span></span>
    </div>
    
    <div class="emoji-bar">
      <span>😀</span><span>😂</span><span>❤️</span><span>👍</span><span>🔥</span><span>🎉</span><span>🙏</span><span>💪</span><span>✅</span><span>🤔</span><span>👀</span><span>💯</span>
    </div>
    
    <div class="input-bar">
      <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off" onkeydown="if(event.key==='Enter')sendMessage()" />
      <button class="send-btn" id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const landing = document.getElementById('landing');
    const chatPage = document.getElementById('chat-page');
    const nameInput = document.getElementById('name-input');
    const joinBtn = document.getElementById('join-btn');
    const messagesEl = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const typingIndicator = document.getElementById('typing-indicator');
    let myName = '';
    let typingTimeout;

    // Enter key on name input
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinChat();
    });

    function joinChat() {
      const name = nameInput.value.trim();
      if (!name) {
        nameInput.style.borderColor = 'var(--danger)';
        nameInput.focus();
        return;
      }
      myName = name;
      landing.style.display = 'none';
      chatPage.classList.add('active');
      socket.emit('visitor join', { name: name });
      messageInput.focus();
    }

    function leaveChat() {
      socket.disconnect();
      chatPage.classList.remove('active');
      landing.style.display = 'flex';
      nameInput.value = '';
      messagesEl.innerHTML = '';
    }

    function sendMessage() {
      const msg = messageInput.value.trim();
      if (!msg) return;
      socket.emit('chat message', { message: msg });
      messageInput.value = '';
      socket.emit('stop typing');
    }

    // Typing indicator
    messageInput.addEventListener('input', () => {
      socket.emit('typing');
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => socket.emit('stop typing'), 2000);
    });

    // Emoji bar
    document.querySelectorAll('.emoji-bar span').forEach(emoji => {
      emoji.addEventListener('click', () => {
        messageInput.value += emoji.textContent;
        messageInput.focus();
      });
    });

    // ===== SOCKET EVENT HANDLERS =====
    socket.on('chat message', (data) => {
      const div = document.createElement('div');
      div.className = 'msg ' + (data.from === 'me' ? 'me' : data.from === 'system' ? 'system' : 'them');
      
      if (data.from === 'them') {
        const sender = document.createElement('span');
        sender.className = 'sender-name';
        sender.textContent = data.name || 'Ghana Cyber';
        div.appendChild(sender);
      }
      
      const text = document.createElement('div');
      text.textContent = data.message;
      div.appendChild(text);
      
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = data.time;
      div.appendChild(time);
      
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    socket.on('admin reply', (data) => {
      const div = document.createElement('div');
      div.className = 'msg them';
      
      const sender = document.createElement('span');
      sender.className = 'sender-name';
      sender.textContent = 'Ghana Cyber';
      div.appendChild(sender);
      
      const text = document.createElement('div');
      text.textContent = data.message;
      div.appendChild(text);
      
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = data.time;
      div.appendChild(time);
      
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      
      // Show typing briefly then message
      typingIndicator.classList.remove('active');
    });

    socket.on('admin typing', () => {
      typingIndicator.classList.add('active');
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    socket.on('disconnect', () => {
      const div = document.createElement('div');
      div.className = 'msg system';
      div.textContent = '⚠️ Connection lost. Reconnecting...';
      messagesEl.appendChild(div);
    });

    socket.on('connect', () => {
      if (myName && chatPage.classList.contains('active')) {
        socket.emit('visitor join', { name: myName });
      }
    });
  </script>
</body>
</html>
